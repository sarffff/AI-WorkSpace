# ServiceDeck 后端 CI：lint + 构建 + 单元测试
# 说明：eval:retrieval / eval:agent 脚本需要真实 MySQL 与 LLM API Key（向量/生成模型），
# 无密钥的 CI 环境无法运行，仅限本地手动执行（pnpm --filter @servicedesk/server eval:retrieval）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: server lint / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本与仓库 packageManager 字段（pnpm@9.5.0）保持一致
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # frozen-lockfile：依赖必须与 pnpm-lock.yaml 完全一致，防止 CI 悄悄漂移
      - run: pnpm install --frozen-lockfile

      # 生成 Prisma Client，供 build 的类型检查与 lint 使用（无需数据库连接）
      - run: pnpm --filter @servicedesk/server exec prisma generate

      - run: pnpm --filter @servicedesk/server lint

      - run: pnpm --filter @servicedesk/server build

      # 单元测试：纯函数 + mock Prisma/Embedding，不依赖真实 DB 与 LLM 网络
      - run: pnpm --filter @servicedesk/server test:ci
